[plugin]
slug = "commerce-usdt"
name = "Commerce USDT"
version = "0.2.0"
description = "USDT (ERC-20) crypto payment gateway for GoPress Commerce. Pull-based confirmation uses a unique HD-derived address per order, verified Ethereum RPC data, atomic scan cursors, chain-time expiry, and idempotent settlement. The implementation is EVM-extensible; Ethereum is the currently supported chain. Satellite plugin that depends only on the core commerce contracts. Opt-in module, disabled by default."
author = "GoPress Team"
default_inactive = true
