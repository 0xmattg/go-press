<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">GoPress Platform Architecture</title>
  <desc id="desc">A high-level commercial architecture diagram showing GoPress digital channels, delivery, experience runtime, content platform, governance, extension ecosystem, and runtime foundation.</desc>

  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#CCD1D8" opacity="0.34"/>
    </pattern>
    <linearGradient id="brandDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.58" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#0C2E67"/>
    </linearGradient>
    <linearGradient id="brandBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D60E6"/>
      <stop offset="1" stop-color="#1F78FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#101112" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#101112"/>
    </marker>
    <style>
      .text { font-family: Arial, Helvetica, sans-serif; fill: #101112; }
      .group-label { font-size: 20px; font-weight: 800; letter-spacing: 1px; }
      .card-title { font-size: 25px; font-weight: 800; }
      .card-copy { font-size: 18px; font-weight: 500; fill: #4C5054; }
      .small-label { font-size: 15px; font-weight: 800; letter-spacing: 1px; }
      .foundation-title { font-size: 18px; font-weight: 800; }
      .foundation-copy { font-size: 15px; font-weight: 500; fill: #74777B; }
      .flow { fill: none; stroke: #101112; stroke-width: 4; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .support-flow { fill: none; stroke: #394250; stroke-width: 3; stroke-linecap: square; marker-end: url(#arrow); }
      .icon { fill: none; stroke: #FFFFFF; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-dark { fill: none; stroke: #252930; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#E8EAEE"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <g class="text">
    <text x="48" y="74" font-size="46" font-weight="900">GoPress Platform Architecture</text>
    <text x="50" y="105" font-size="20" font-weight="600" fill="#74777B">Composable digital experience delivery in one compiled Go runtime</text>
    <rect x="1510" y="55" width="360" height="42" rx="21" fill="#101112" stroke="#252930" stroke-width="2"/>
    <text x="1690" y="82" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">MODULAR &#8226; EXTENSIBLE &#8226; GOVERNED</text>
  </g>

  <!-- Channels and users -->
  <g filter="url(#shadow)">
    <rect x="40" y="165" width="320" height="770" rx="20" fill="#F8F8F6" stroke="#101112" stroke-width="3"/>
  </g>
  <g class="text">
    <text x="72" y="215" class="group-label">CHANNELS &amp; USERS</text>
    <text x="72" y="241" font-size="16" font-weight="600" fill="#74777B">One platform, multiple experiences</text>

    <g filter="url(#shadow)">
      <rect x="70" y="280" width="260" height="158" rx="14" fill="#EAF2FF" stroke="#0D60E6" stroke-width="3"/>
      <rect x="70" y="478" width="260" height="158" rx="14" fill="#F0F4FA" stroke="#4A73A8" stroke-width="3"/>
      <rect x="70" y="676" width="260" height="158" rx="14" fill="#F3F5F8" stroke="#637895" stroke-width="3"/>
    </g>

    <circle cx="112" cy="324" r="23" fill="#0D60E6"/>
    <circle cx="112" cy="324" r="13" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M99 324h26M112 311c6 7 6 19 0 26M112 311c-6 7-6 19 0 26" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="92" y="373" class="card-title">Site Visitors</text>
    <text x="92" y="404" class="card-copy">Websites and content</text>
    <text x="92" y="428" class="card-copy">experiences</text>

    <circle cx="112" cy="522" r="23" fill="#4A73A8"/>
    <circle cx="112" cy="516" r="7" fill="#FFFFFF"/>
    <path d="M98 538c2-12 26-12 28 0" fill="#FFFFFF"/>
    <text x="92" y="571" class="card-title">Content Teams</text>
    <text x="92" y="602" class="card-copy">Editorial workflows and</text>
    <text x="92" y="626" class="card-copy">administration</text>

    <circle cx="112" cy="720" r="23" fill="#637895"/>
    <path d="M108 708l-10 12 10 12M116 708l10 12-10 12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="769" class="card-title">Developers</text>
    <text x="92" y="800" class="card-copy">APIs, integrations and</text>
    <text x="92" y="824" class="card-copy">delivery systems</text>
  </g>

  <!-- Main platform frame -->
  <g filter="url(#shadow)">
    <rect x="400" y="145" width="1480" height="860" rx="24" fill="#F8F8F6" stroke="#0C2E67" stroke-width="4"/>
  </g>
  <g class="text">
    <text x="446" y="195" class="group-label" fill="#0D60E6">GOPRESS DIGITAL EXPERIENCE PLATFORM</text>
    <text x="446" y="222" font-size="16" font-weight="600" fill="#74777B">A unified core for content, experiences, extensions and operations</text>
  </g>

  <!-- Delivery -->
  <g filter="url(#shadow)">
    <rect x="500" y="255" width="1280" height="108" rx="14" fill="url(#brandDark)" stroke="#050505" stroke-width="3"/>
  </g>
  <g class="text">
    <rect x="530" y="282" width="50" height="50" rx="12" fill="url(#brandBlue)"/>
    <g class="icon" transform="translate(540 292)">
      <circle cx="15" cy="5" r="3"/>
      <circle cx="5" cy="25" r="3"/>
      <circle cx="25" cy="25" r="3"/>
      <path d="M13.5 8L6.5 22M16.5 8l7 14M8 25h14"/>
    </g>
    <text x="600" y="301" class="card-title" fill="#FFFFFF">Unified Delivery Layer</text>
    <text x="600" y="334" font-size="18" font-weight="600" fill="#D8E6F8">HTTP routing &#8226; Public site &#8226; Admin studio &#8226; REST / OpenAPI &#8226; Page cache</text>
  </g>

  <!-- Three platform pillars -->
  <g filter="url(#shadow)">
    <rect x="500" y="430" width="390" height="225" rx="16" fill="#EAF2FF" stroke="#2F6FEA" stroke-width="3"/>
    <rect x="945" y="430" width="390" height="225" rx="16" fill="#EDF4FF" stroke="#4D86E8" stroke-width="3"/>
    <rect x="1390" y="430" width="390" height="225" rx="16" fill="#F1F5FB" stroke="#6F8EBE" stroke-width="3"/>
  </g>

  <g class="text">
    <rect x="528" y="458" width="50" height="50" rx="12" fill="#2F6FEA"/>
    <g class="icon" transform="translate(539 469)">
      <rect x="1" y="2" width="26" height="20" rx="3"/>
      <path d="M1 8h26M6 5h.1M10 5h.1M10 27h8M14 22v5"/>
    </g>
    <text x="598" y="483" class="card-title">Experience Runtime</text>
    <text x="530" y="531" class="card-copy">Theme rendering and templates</text>
    <text x="530" y="563" class="card-copy">URL, SEO and sitemap</text>
    <text x="530" y="595" class="card-copy">Navigation and internationalization</text>
    <rect x="530" y="618" width="190" height="25" rx="12" fill="#D8E7FF"/>
    <text x="625" y="636" text-anchor="middle" font-size="14" font-weight="800" fill="#0A56C2">EXPERIENCE DELIVERY</text>

    <rect x="973" y="458" width="50" height="50" rx="12" fill="#4D86E8"/>
    <g class="icon" transform="translate(984 469)">
      <rect x="5" y="1" width="22" height="24" rx="3"/>
      <path d="M1 6v20a3 3 0 003 3h18M10 8h12M10 13h12M10 18h8"/>
    </g>
    <text x="1043" y="483" class="card-title">Content Platform</text>
    <text x="975" y="531" class="card-copy">Content, metadata and taxonomy</text>
    <text x="975" y="563" class="card-copy">Media and responsive variants</text>
    <text x="975" y="595" class="card-copy">Accounts, sessions and comments</text>
    <rect x="975" y="618" width="176" height="25" rx="12" fill="#DEEAFE"/>
    <text x="1063" y="636" text-anchor="middle" font-size="14" font-weight="800" fill="#315F9F">CONTENT SERVICES</text>

    <rect x="1418" y="458" width="50" height="50" rx="12" fill="#6F8EBE"/>
    <g class="icon" transform="translate(1429 468)">
      <path d="M14 1l11 4v8c0 8-5 13-11 16C8 26 3 21 3 13V5z"/>
      <path d="M9 14l3 3 7-8"/>
    </g>
    <text x="1486" y="483" font-size="21" font-weight="800">Governance &amp; Automation</text>
    <text x="1420" y="531" class="card-copy">Administration, RBAC and audit</text>
    <text x="1420" y="563" class="card-copy">Mail and operational controls</text>
    <text x="1420" y="595" class="card-copy">Workers and scheduled tasks</text>
    <rect x="1420" y="618" width="205" height="25" rx="12" fill="#E0E8F4"/>
    <text x="1522" y="636" text-anchor="middle" font-size="14" font-weight="800" fill="#45658E">PLATFORM GOVERNANCE</text>
  </g>

  <!-- Core extension contract -->
  <g filter="url(#shadow)">
    <rect x="500" y="710" width="1280" height="92" rx="14" fill="#E6EEFC" stroke="#284F90" stroke-width="3"/>
  </g>
  <g class="text">
    <rect x="530" y="731" width="50" height="50" rx="12" fill="#284F90"/>
    <g class="icon" transform="translate(540 741)">
      <circle cx="5" cy="15" r="3"/>
      <circle cx="24" cy="5" r="3"/>
      <circle cx="24" cy="25" r="3"/>
      <path d="M8 14l13-7M8 16l13 7M5 8v4"/>
    </g>
    <text x="600" y="751" class="card-title">Core Extension Contract</text>
    <text x="600" y="779" font-size="18" font-weight="600" fill="#163C7A">Hooks &#8226; Filters &#8226; Providers &#8226; Registries &#8226; Template helpers</text>
    <rect x="1510" y="731" width="240" height="48" rx="24" fill="#FFFFFF" stroke="#99BDF2" stroke-width="2"/>
    <text x="1630" y="761" text-anchor="middle" font-size="15" font-weight="800" fill="#284F90">NO DIRECT COUPLING</text>
  </g>

  <!-- Extension ecosystem -->
  <g filter="url(#shadow)">
    <rect x="500" y="840" width="600" height="74" rx="14" fill="#EDF3FC" stroke="#4779BE" stroke-width="3"/>
    <rect x="1180" y="840" width="600" height="74" rx="14" fill="#EEF2F8" stroke="#567094" stroke-width="3"/>
  </g>
  <g class="text">
    <rect x="524" y="855" width="52" height="44" rx="11" fill="#4779BE"/>
    <g class="icon" transform="translate(536 865)">
      <path d="M14 1l13 7-13 7L1 8zM1 14l13 7 13-7M1 20l13 7 13-7"/>
    </g>
    <text x="594" y="871" font-size="22" font-weight="800">Theme Ecosystem</text>
    <text x="594" y="898" font-size="16" font-weight="600" fill="#4C5054">Presentation &#8226; Templates &#8226; Assets &#8226; Demo content</text>

    <rect x="1204" y="855" width="52" height="44" rx="11" fill="#567094"/>
    <g class="icon" transform="translate(1216 865)">
      <path d="M9 1v9M19 1v9M5 10h18v3a9 9 0 01-9 9v6M9 28h10"/>
    </g>
    <text x="1274" y="871" font-size="22" font-weight="800">Plugin Ecosystem</text>
    <text x="1274" y="898" font-size="16" font-weight="600" fill="#4C5054">Identity &#8226; Analytics &#8226; SEO &#8226; Automation</text>
  </g>

  <!-- Runtime foundation -->
  <g>
    <rect x="500" y="940" width="1280" height="48" rx="12" fill="#E3E7ED" stroke="#AAB3BF" stroke-width="2"/>
    <line x1="820" y1="940" x2="820" y2="988" stroke="#AAB3BF" stroke-width="2"/>
    <line x1="1140" y1="940" x2="1140" y2="988" stroke="#AAB3BF" stroke-width="2"/>
    <line x1="1460" y1="940" x2="1460" y2="988" stroke="#AAB3BF" stroke-width="2"/>
  </g>
  <g class="text">
    <g class="icon-dark" transform="translate(596 951)">
      <ellipse cx="12" cy="4" rx="10" ry="3"/>
      <path d="M2 4v16c0 2 4 4 10 4s10-2 10-4V4M2 12c0 2 4 4 10 4s10-2 10-4"/>
    </g>
    <text x="632" y="970" class="foundation-title">PostgreSQL</text>

    <g class="icon-dark" transform="translate(898 951)">
      <path d="M14 1L4 14h8l-2 9 10-13h-8z"/>
    </g>
    <text x="934" y="970" class="foundation-title">Memory + Redis</text>

    <g class="icon-dark" transform="translate(1205 951)">
      <rect x="1" y="2" width="25" height="21" rx="3"/>
      <circle cx="19" cy="8" r="2.5"/>
      <path d="M4 20l7-7 5 5 3-3 5 5"/>
    </g>
    <text x="1241" y="970" class="foundation-title">Media &amp; Site Assets</text>

    <g class="icon-dark" transform="translate(1524 951)">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 1v4M12 19v4M1 12h4M19 12h4M4 4l3 3M17 17l3 3M20 4l-3 3M7 17l-3 3"/>
    </g>
    <text x="1560" y="970" class="foundation-title">Go Runtime &amp; Workers</text>
  </g>

  <!-- Main flows -->
  <path class="flow" d="M330 350 H420 V285 H500"/>
  <path class="flow" d="M330 548 H445 V309 H500"/>
  <path class="flow" d="M330 746 H470 V334 H500"/>

  <path class="flow" d="M695 363 V430"/>
  <path class="flow" d="M1140 363 V430"/>
  <path class="flow" d="M1585 363 V430"/>

  <path class="support-flow" d="M695 710 V655"/>
  <path class="support-flow" d="M1140 710 V655"/>
  <path class="support-flow" d="M1585 710 V655"/>

  <path class="support-flow" d="M800 840 V802"/>
  <path class="support-flow" d="M1480 840 V802"/>

  <!-- Extension relationship labels -->
  <g class="text">
    <rect x="650" y="809" width="132" height="24" rx="12" fill="#101112" stroke="#101112" stroke-width="1.5"/>
    <text x="716" y="826" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.8" fill="#FFFFFF">PRESENTATION</text>
    <rect x="1498" y="809" width="132" height="24" rx="12" fill="#101112" stroke="#101112" stroke-width="1.5"/>
    <text x="1564" y="826" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="0.8" fill="#FFFFFF">CAPABILITIES</text>
  </g>

</svg>
