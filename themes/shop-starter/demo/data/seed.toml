excerpt = "Comfortable wireless listening with active noise cancellation and 40-hour battery life."
content = """<h2>Made for focused listening</h2><p>Quiet Arc combines adaptive noise cancellation, soft memory-foam cushions, and a balanced wireless sound profile.</p><ul><li>Up to 40 hours of playback</li><li>Fast USB-C charging</li><li>Multipoint Bluetooth connection</li></ul>"""
