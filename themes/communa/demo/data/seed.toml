# ============================================================
# Communa — Demo Seed Data
# A friendly community: members, groups, discussions, and posts.
#
# Image strategy (kept light so demo import stays fast):
#   - Member avatars: DiceBear (8 downloads). Each member's avatar is reused
#     verbatim as the author avatar of their posts/discussions, so the importer
#     de-duplicates and downloads it only once.
#   - Post images: Lorem Picsum (8 downloads).
#   - Groups use the theme's built-in gradient cover fallback (0 downloads).
#   Total remote downloads ≈ 16. All URLs always resolve; on a failed download
#   the importer keeps the remote URL rather than aborting.
# ============================================================

