[[contents]]
type = "post"
title = "5 ways to make a group feel like home"
slug = "make-a-group-feel-like-home"
excerpt = "Small habits that turn a member list into a real community."
image_url = "https://picsum.photos/seed/communa-post-home/1040/560"
content = """<p>Great communities aren't built by features — they're built by people showing up with care. Here are five habits we've seen work again and again.</p><h3>1. Welcome every newcomer</h3><p>A single friendly reply changes everything.</p><h3>2. Ask real questions</h3><p>Curiosity invites conversation. Prompts beat announcements.</p><h3>3. Celebrate small wins</h3><p>First PR, first loaf, first 5k — cheer it on.</p><h3>4. Keep it kind</h3><p>Assume good faith, and moderate for warmth.</p><h3>5. Show up regularly</h3><p>Consistency is what turns a page into a home.</p>"""
category = "community-news"
tags = ["welcome", "ui-design"]
