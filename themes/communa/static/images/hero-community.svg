<svg xmlns="http://www.w3.org/2000/svg" viewBox="48 48 438 322" width="438" height="322" fill="none" role="img" aria-label="">
  <defs>
    <linearGradient id="cmnA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3aaede"/><stop offset="1" stop-color="#2f9bc9"/></linearGradient>
    <linearGradient id="cmnB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8bd15a"/><stop offset="1" stop-color="#67aa35"/></linearGradient>
    <linearGradient id="cmnC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6b352"/><stop offset="1" stop-color="#ef9a34"/></linearGradient>
    <filter id="cmnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0d1b2a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- connectors -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round">
    <path d="M150 120 C 220 110, 260 90, 320 96"/>
    <path d="M150 120 C 140 190, 170 250, 210 286"/>
    <path d="M330 150 C 340 210, 320 250, 250 300"/>
  </g>

  <!-- big chat bubble -->
  <g filter="url(#cmnShadow)">
    <path d="M300 60 h150 a20 20 0 0 1 20 20 v70 a20 20 0 0 1 -20 20 h-92 l-30 26 v-26 h-28 a20 20 0 0 1 -20 -20 v-70 a20 20 0 0 1 20 -20 z" fill="#ffffff"/>
  </g>
  <circle cx="330" cy="115" r="7" fill="url(#cmnB)"/>
  <circle cx="360" cy="115" r="7" fill="#cbd3dc"/>
  <circle cx="390" cy="115" r="7" fill="#cbd3dc"/>

  <!-- member chip A -->
  <g filter="url(#cmnShadow)">
    <rect x="70" y="86" width="196" height="70" rx="18" fill="#ffffff"/>
  </g>
  <circle cx="106" cy="121" r="22" fill="url(#cmnA)"/>
  <path d="M106 116 a7 7 0 1 0 0.01 0 M92 138 a14 12 0 0 1 28 0" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="142" y="108" width="96" height="12" rx="6" fill="#2b2f3a" fill-opacity="0.85"/>
  <rect x="142" y="128" width="66" height="10" rx="5" fill="#9aa3af"/>

  <!-- member chip B -->
  <g filter="url(#cmnShadow)">
