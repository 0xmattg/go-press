  <circle cx="470" cy="330" r="7" fill="#3aaede" fill-opacity="0.9"/>
  <circle cx="300" cy="360" r="5" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="90" cy="300" r="4" fill="#ffffff" fill-opacity="0.55"/>
