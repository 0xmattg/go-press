  </g>
  <circle cx="188" cy="286" r="23" fill="url(#cmnB)"/>
  <path d="M188 281 a7 7 0 1 0 0.01 0 M173 304 a15 12 0 0 1 30 0" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="226" y="272" width="104" height="12" rx="6" fill="#2b2f3a" fill-opacity="0.85"/>
  <rect x="226" y="293" width="72" height="10" rx="5" fill="#9aa3af"/>

  <!-- small like/heart bubble -->
  <g filter="url(#cmnShadow)">
    <circle cx="404" cy="250" r="34" fill="url(#cmnC)"/>
  </g>
  <path d="M404 266 c-16 -11 -22 -20 -22 -28 a10 10 0 0 1 22 -4 a10 10 0 0 1 22 4 c0 8 -6 17 -22 28 z" fill="#ffffff"/>

  <!-- floating dots -->
