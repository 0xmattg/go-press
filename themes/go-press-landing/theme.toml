[theme]
name = "GoPress Landing"
version = "1.0.0"
description = "A futuristic, single-page tech landing page theme for GoPress."
author = "GoPress Team"

# Declarative dependencies (theme -> plugin). Resolved/enforced by core on boot
# and theme switch. See the "Theme Dependencies and Versioning" guide.
#   - core:    running core is 0.6.19, so ">=0.6.0" is satisfied. Change it to
#              ">=0.7.0" and rebuild to see the blocked state + admin banner.
#   - plugins: seo-extras is auto-activated when this theme is active; while
#              active it cannot be deactivated. Bump the constraint to ">=99.0.0"
#              to test the version-mismatch block.
[requires]
core = ">=0.6.0"
plugins = [
  { slug = "seo-extras", version = ">=1.0.0" },
]

[[content_types]]
name = "feature"
label = "Feature"
label_plural = "Features"
supports = ["title", "content", "excerpt", "sort_order"]
has_archive = false
rewrite_slug = "features"
menu_icon = "blocks"
menu_order = 1

[[content_types.meta_fields]]
key = "icon"
label = "Icon Name"
type = "string"

[[content_types]]
name = "testimonial"
label = "Testimonial"
label_plural = "Testimonials"
supports = ["title", "content", "excerpt", "thumbnail", "sort_order"]
has_archive = false
rewrite_slug = "testimonials"
menu_icon = "contact_message"
menu_order = 2

[[content_types.meta_fields]]
key = "role"
label = "Job Title"
type = "string"

[[content_types.meta_fields]]
key = "company"
label = "Company"
type = "string"
