[theme]
name = "Mono Journal"
version = "1.1.0"
description = "A refined monochrome personal journal theme for essays, notes, and independent publishing."
author = "GoPress Team"

[requires]
core = ">=0.6.0"
plugins = [
  { slug = "google-identity", version = ">=1.0.1" },
]

[[menu_locations]]
name = "header"
label = "顶部导航"

[[menu_locations]]
name = "footer"
label = "底部导航"

[[page_templates]]
name = "Standard"
template = "page"

[[page_templates]]
name = "Wide Essay"
template = "page-wide"
