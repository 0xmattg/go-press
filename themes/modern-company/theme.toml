[theme]
name = "Modern Company"
version = "1.0.3"
description = "A modern, professional company website theme for GoPress."
author = "Hurricane Techs"

# Declarative dependencies (theme -> plugin). Resolved/enforced by core on boot
# and theme switch. See the "Theme Dependencies and Versioning" guide.
#   - core:    running core is 0.6.19, so ">=0.6.0" is satisfied. Change it to
#              ">=0.7.0" and rebuild to see the blocked state + admin banner.
#   - plugins: seo-extras is auto-activated when this theme is active; while
#              active it cannot be deactivated. Bump the constraint to ">=99.0.0"
#              to test the version-mismatch block.
[requires]
core = ">=0.6.0"
plugins = [
  { slug = "seo-extras", version = ">=1.0.0" },
]

# Content types supported by the theme.
[[content_types]]
name = "product"
label = "产品"
label_plural = "产品列表"
archive_title_key = "page_title_product"
supports = ["title", "content", "excerpt", "thumbnail", "sort_order"]
taxonomies = ["category", "tag"]
has_archive = true
rewrite_slug = "products"
menu_icon = "blocks"
menu_order = 1

[[content_types]]
name = "service"
label = "服务"
label_plural = "服务列表"
archive_title_key = "page_title_service"
supports = ["title", "content", "excerpt", "thumbnail", "sort_order"]
taxonomies = ["category", "tag"]
has_archive = true
rewrite_slug = "services"
menu_icon = "edit"
menu_order = 2

[[content_types]]
name = "showcase"
label = "案例"
label_plural = "案例展示"
archive_title_key = "page_title_showcase"
supports = ["title", "content", "excerpt", "thumbnail", "sort_order"]
taxonomies = ["category", "tag"]
has_archive = true
rewrite_slug = "showcase"
menu_icon = "collection"
menu_order = 3

[[content_types.meta_fields]]
key = "client"
label = "客户"
type = "string"

[[content_types.meta_fields]]
key = "location"
label = "位置"
type = "string"

# Menu locations supported by the theme.
[[menu_locations]]
name = "header"
label = "顶部导航"

[[menu_locations]]
name = "footer"
label = "底部导航"

# Selectable page templates for the standalone Pages module. The admin page
# editor shows these in a "Page Template" dropdown; the choice is stored per
# page (page_template meta) and resolved to templates/pages/<template>.tmpl.
# The empty "default" choice falls back to page-<slug> → page automatically.
[[page_templates]]
name = "标准页面"
template = "page"

[[page_templates]]
name = "全宽页面"
template = "page-full-width"

# "The page is a feature" example: embeds an independent functional fragment
# (a stock K-line iframe widget). Theme-authored trusted markup, so iframes/JS
# are allowed here — unlike the sanitized rich-text body.
[[page_templates]]
name = "嵌入功能页（iframe）"
template = "page-embed"
